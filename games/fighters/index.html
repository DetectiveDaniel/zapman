<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FIGHTERS!</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="stage-wrap" aria-label="FIGHTERS game">
        <canvas id="game" width="1024" height="640"></canvas>
        <div id="message" class="message">Reach the finish line!</div>
      </section>
      <aside class="panel">
        <p class="kicker">FIGHTERS!</p>
        <h1>Battlefield Run</h1>
        <div class="stat"><span>Hearts</span><strong id="hearts">5</strong></div>
        <div class="stat"><span>Soldiers</span><strong id="soldiers">0</strong></div>
        <div class="stat"><span>Distance</span><strong id="distance">0%</strong></div>
        <button id="restart" type="button">Restart</button>
        <p class="help">WASD / arrows move. Space shoots fireballs. G throws grenades. Reach the finish line.</p>
      </aside>
    </main>
    <script src="game.js"></script>
  </body>
</html>
