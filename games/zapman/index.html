<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zapman — The strange watch</title>
  <link rel="stylesheet" href="styles.css">
  <script src="../../display-settings.js"></script>
    <script src="../../educational-questions.js"></script>
    <script src="../../educational-mode.js"></script>
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div class="brand"><img src="logo.svg" width="42" height="48" alt="Zapman lightning logo"><div><span class="eyebrow">ZAPMAN STUDIOS</span><h1>Zapman</h1></div></div>
      <div class="chapter"><span id="chapter">PROLOGUE</span><strong id="mission">The strange watch</strong></div>
      <button id="pause" type="button" disabled>Pause</button>
      <button id="skipLevel" type="button" disabled>Skip Level</button>
      <button id="replay" type="button">Restart story</button>
    </header>
    <section class="stage" aria-label="Zapman adventure">
      <canvas id="game" width="1000" height="620" tabindex="0" aria-label="Move with arrows or WASD. E continues the story. C shrinks or grows. In Levels 5 to 7, 12 and 13, J, Space, click or the Zap button fires your watch. In Level 2, The Rip in the Wardrobe, escape invading robots and scorpions and find the antidote to cure the people-robots. The Rip in the Wardrobe is Dimension 0001, Earth. Level 7 is The Hysterics: fight ten Roman soldiers, receive a vial, then open your portal to Level 8, The Sea of Memories. You move slightly slower underwater. Dodge patrolling octopuses and coral-covered rocks, and reach the glowing exit portal to Level 9, Powerless. Your watch jams when you try to shrink. Dodge hostile Betterworlders and invisible barriers to collect another thought vial, return to Sapphire and have your watch repaired. Sapphire sends you to Level 10, Cries of the Parasings: shrink and grow in a rainforest, dodge fast-flying eagles, and reach her warning about the terrible darkness. Lasers are disabled in Level 10. Level 11 is The Shadow Dimension: follow the lights through thick fog, escape your own shadow and other chasing shadows, and reach the exit portal. Return to Sapphire for Level 12, The Last Stand: dodge punching people, use your watch to fight, and destroy a machine whose rays control you for five seconds. Level 13 is The Waistlanders: dodge giant cockroaches throwing TVs, books, toys, food and water bottles, use scrap walls for cover and reach the exit portal."></canvas>
      <button id="titleMusicButton" class="title-music-button" type="button" aria-pressed="true" aria-label="Toggle title music" hidden>Music: On</button>
      <div class="city-hud" id="cityHud" hidden><span id="hearts" aria-label="5 hearts">♥ ♥ ♥ ♥ ♥</span><span id="sizeState">NORMAL SIZE</span><span id="distance">FINISH · 4,000m</span></div>
      <div class="pause-overlay" id="paused" hidden><strong>PAUSED</strong><span>Take a breath, dimension traveller.</span><button id="resume" type="button">Keep going</button></div>
    </section>
    <section class="story-panel" aria-labelledby="speaker">
      <div class="story-copy"><span class="eyebrow" id="speaker">THE STRANGE WATCH</span><p id="story" role="status">You find a strange watch.</p></div>
      <div id="actions" class="actions"><button type="button" data-action="advance">Put it in your bag →</button></div>
    </section>
    <footer><span><b>↑ ↓ ← → / WASD</b> Move</span><span><b>E / Enter</b> Continue</span><span><b>C</b> Shrink / grow</span><span><b>J / Space / Click</b> Watch zap when available</span><span><b>P</b> Pause</span></footer>
    <div class="touch-controls" aria-label="Touch controls"><div class="dpad"><button data-key="ArrowUp" aria-label="Move up">↑</button><button data-key="ArrowLeft" aria-label="Move left">←</button><button data-key="ArrowDown" aria-label="Move down">↓</button><button data-key="ArrowRight" aria-label="Move right">→</button></div><button id="touchAction" type="button">E · Continue</button><button id="shrink" type="button" disabled aria-pressed="false">C · Shrink</button></div>
    <button id="zap" class="watch-zap" type="button" hidden>J / Space · WATCH ZAP</button>
  </main>
  <script src="model.js"></script>
  <audio id="titleTheme" src="assets/title-theme.m4a" preload="auto" loop></audio>
  <script src="title-music.js"></script>
  <script src="../../arcade-audio.js"></script>
    <script src="game.js"></script>
    <script src="../../arcade-audio-adapters.js"></script>
  <script src="../../game-picker-back.js"></script>
</body>
</html>
