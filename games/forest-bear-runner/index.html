<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forest Bear Runner</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="hud" aria-label="Game status">
        <a class="back-link" href="../index.html">Back</a>
        <div>
          <span>Distance</span>
          <strong id="score">0 m</strong>
        </div>
        <div>
          <span>Best</span>
          <strong id="best">0 m</strong>
        </div>
        <div>
          <span>Bear speed</span>
          <strong id="bearSpeed">1x</strong>
        </div>
        <div>
          <span>Bear health</span>
          <strong id="bearHealth">100</strong>
        </div>
      </section>

      <canvas id="game" width="960" height="540" aria-label="Forest running game"></canvas>

      <section class="dressing-room" aria-label="Character dressing room">
        <span>Dressing room</span>
        <button class="skin-button skin-0 active" type="button" data-skin="0"><i></i><span>Blond</span></button>
        <button class="skin-button skin-1" type="button" data-skin="1"><i></i><span>Blue</span></button>
        <button class="skin-button skin-2" type="button" data-skin="2"><i></i><span>Brown</span></button>
        <button class="skin-button skin-3" type="button" data-skin="3"><i></i><span>Green</span></button>
        <button class="skin-button skin-4" type="button" data-skin="4"><i></i><span>Red</span></button>
      </section>

      <section class="controls" aria-label="Controls">
        <button id="leftButton" type="button">Left</button>
        <button id="jumpButton" type="button">Jump</button>
        <button id="duckButton" type="button">Duck</button>
        <button id="rightButton" type="button">Right</button>
        <button id="restartButton" type="button">Restart</button>
      </section>
    </main>

    <script src="game.js"></script>
    <script src="../../game-picker-back.js"></script>
  </body>
</html>
