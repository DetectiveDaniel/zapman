<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subway Surfers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="game-wrap" aria-label="Subway Surfers game">
      <canvas id="game" width="960" height="640"></canvas>
      <div class="hud top-left">
        <button id="pause" class="icon-button" type="button" aria-label="Pause game">II</button>
        <span id="mission">0 / 20</span>
      </div>
      <div class="hud top-right">
        <span id="multiplier">x1</span>
        <span id="score">000000</span>
      </div>
      <div class="hud bottom-left">
        <span id="coins">0 coins</span>
        <span id="tokens">0 tokens</span>
        <span id="board">Hoverboard ready</span>
      </div>
      <div id="message" class="message">
        <h1>Subway Surfers</h1>
        <p>Arrow keys or A/D to switch lanes. W/Up to jump, S/Down to duck, Space for hoverboard, F for NITRO.</p>
        <button id="start" type="button">Start Run</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
    <script src="../hide-n-seek/game-picker-back.js"></script>
  <script src="../../game-picker-back.js"></script>
</body>
</html>
