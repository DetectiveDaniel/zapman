<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Blast</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <canvas id="game" width="960" height="640" aria-label="Bubble Blast game"></canvas>
    <section id="menu" class="main-menu" aria-label="Bubble Blast main menu">
      <div class="led-panel">
        <h1>Bubble Blast</h1>
        <button id="start" type="button">Start</button>
      </div>
    </section>
    <div class="hud" aria-hidden="true">
      <div class="brand">Bubble Blast</div>
      <div class="meters">
        <span id="score">Score 0</span>
        <span id="level">Level 1</span>
      </div>
    </div>
    <button id="restart" type="button">Restart</button>
  </main>
  <script src="game.js"></script>
    <script src="../hide-n-seek/game-picker-back.js"></script>
  <script src="../../game-picker-back.js"></script>
</body>
</html>
