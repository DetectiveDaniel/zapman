<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TNT Parkour</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" width="1120" height="630" aria-label="TNT Parkour game"></canvas>
      <section class="hud" aria-live="polite">
        <div class="hearts" id="hearts"></div>
        <div class="status" id="status">Reach the finish. Spikes hurt. F punches.</div>
        <div class="weapon" id="weapon">No gun</div>
        <button class="skip-level" id="skipLevel" type="button">Skip Level</button>
      </section>
      <section class="controls">
        <span>Move: A/D or arrows</span>
        <span>Jump: W, up, or space</span>
        <span>Punch: F</span>
        <span>Fire gun: click or J</span>
      </section>
    </main>

    <div class="dialog hidden" id="tntDialog" role="dialog" aria-modal="true" aria-labelledby="tntTitle">
      <div class="dialog-panel">
        <h1 id="tntTitle">Do you want to light this TNT?</h1>
        <div class="dialog-actions">
          <button id="lightTnt">Yes</button>
          <button id="skipTnt">No</button>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
    <script src="../hide-n-seek/game-picker-back.js"></script>
  </body>
</html>
