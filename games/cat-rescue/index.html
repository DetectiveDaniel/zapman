<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Rescue</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section id="selectScreen" class="screen screen--select">
      <div class="select-copy">
        <p class="eyebrow">Cat Rescue</p>
        <h1>Pick your rescue cat</h1>
        <p class="tagline">Blast through the dog patrol, beat the big dog, grab the key, then press Enter at the cage.</p>
      </div>

      <div class="character-grid" aria-label="Choose a cat">
        <button class="character-card is-selected" data-cat="milo" type="button">
          <img src="assets/kitten-hero.png" alt="Milo the kitten">
          <span>Milo</span>
          <small>Balanced</small>
        </button>
        <button class="character-card" data-cat="pepper" type="button">
          <span class="pixel-cat pixel-cat--pepper" aria-hidden="true"></span>
          <span>Pepper</span>
          <small>Fast paws</small>
        </button>
        <button class="character-card" data-cat="nimbus" type="button">
          <span class="pixel-cat pixel-cat--nimbus" aria-hidden="true"></span>
          <span>Nimbus</span>
          <small>Power shots</small>
        </button>
      </div>

      <button id="startButton" class="primary-button" type="button">Start Rescue</button>
    </section>

    <section id="gameScreen" class="screen screen--game" hidden>
      <header class="hud">
        <div>
          <span class="label">Lives</span>
          <strong id="lives">5</strong>
        </div>
        <div>
          <span class="label">Dogs defeated</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">Key</span>
          <strong id="keyStatus">No</strong>
        </div>
        <button id="enterButton" type="button" disabled>Enter</button>
      </header>

      <canvas id="game" width="960" height="540" aria-label="Cat Rescue game board"></canvas>

      <footer class="controls">
        <span>Move: WASD or arrows</span>
        <span>Shoot: Space or click</span>
        <span>Free cats: Enter</span>
      </footer>
    </section>
  </main>

  <script src="game.js"></script>
  <script src="../../game-picker-back.js"></script>
</body>
</html>
