<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cat Rescue</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="game-picker-back" href="../../index.html" data-game-picker-back="true" aria-label="Go back to the game picker">GO BACK</a>
    <main class="shell">
      <section id="menu" class="menu">
        <div>
          <span class="label">Pixel rescue mission</span>
          <h1>Cat Rescue</h1>
          <p>Choose your cat, blast guard dogs, dodge spikes, win the key, and unlock the cages.</p>
        </div>
        <div class="picker">
          <span class="label">Cat colour</span>
          <div id="swatches" class="swatches"></div>
          <button id="play" type="button">Play</button>
        </div>
      </section>

      <section class="hud">
        <div><span class="label">Level</span><strong id="level">1</strong></div>
        <div><span class="label">Health</span><strong id="health">15</strong></div>
        <div><span class="label">Key</span><strong id="key">No</strong></div>
        <div><span class="label">Cats</span><strong id="cats">0/8</strong></div>
        <div><span class="label">Dogs</span><strong id="dogs">0</strong></div>
        <button id="restart" type="button">Restart</button>
      </section>

      <canvas id="game" width="960" height="540" aria-label="Cat Rescue game"></canvas>

      <section class="controls">
        <span>WASD or arrows move</span>
        <span>Click or F shoots</span>
        <span>Space unlocks cages</span>
      </section>
    </main>
    <script src="game.js"></script>
    <script src="../../game-picker-back.js"></script>
  </body>
</html>
